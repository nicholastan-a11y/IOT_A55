<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs & Configuration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="card logs-container">
    <div class="card-header" style="margin-bottom: 16px;">
      <h2>Configuration Settings</h2>
      <p class="subtitle">Thresholds & Timing Parameters (pico_001)</p>
    </div>

    <!-- Thresholds Section -->
    <div class="config-section">
      <div class="config-header">Thresholds Parameters</div>
      <div class="config-grid">
        <div class="form-group">
          <label>Temp Max (°C)</label>
          <input type="number" id="tempMax" class="input-field">
        </div>
        <div class="form-group">
          <label>Temp Min (°C)</label>
          <input type="number" id="tempMin" class="input-field">
        </div>
        <div class="form-group">
          <label>Humidity Max (%)</label>
          <input type="number" id="humMax" class="input-field">
        </div>
        <div class="form-group">
          <label>Humidity Min (%)</label>
          <input type="number" id="humMin" class="input-field">
        </div>
      </div>
    </div>

    <!-- Timing Section -->
    <div class="config-section">
      <div class="config-header">Timing Parameters</div>
      <div class="form-group">
        <label>Read Interval (sec)</label>
        <input type="number" id="readInterval" class="input-field">
      </div>
      <div class="form-group">
        <label>Keep Alive (sec)</label>
        <input type="number" id="keepAlive" class="input-field">
      </div>
      <div class="form-group">
        <label>Alert Cooldown (ms)</label>
        <input type="number" id="alertCooldown" class="input-field">
      </div>
    </div>

    <button class="btn btn-primary" style="margin-top: 16px;" onclick="saveConfigurations()">Save Configurations</button>
  </div>

  <script src="config.js"></script>
  <script>
    firebase.initializeApp(firebaseConfig);
    const configRef = firebase.database().ref('devices/pico_001/configuration');

    configRef.once('value', (snapshot) => {
      const config = snapshot.val();
      if (!config) return;

      document.getElementById('tempMax').value = config.thresholds?.temperature_max ?? '';
      document.getElementById('tempMin').value = config.thresholds?.temperature_min ?? '';
      document.getElementById('humMax').value = config.thresholds?.humidity_max ?? '';
      document.getElementById('humMin').value = config.thresholds?.humidity_min ?? '';

      document.getElementById('readInterval').value = config.timing?.read_interval_sec ?? '';
      document.getElementById('keepAlive').value = config.timing?.keep_alive_sec ?? '';
      document.getElementById('alertCooldown').value = config.timing?.immediate_alert_cooldown ?? '';
    });

    function saveConfigurations() {
      const updatedConfig = {
        thresholds: {
          temperature_max: Number(document.getElementById('tempMax').value),
          temperature_min: Number(document.getElementById('tempMin').value),
          humidity_max: Number(document.getElementById('humMax').value),
          humidity_min: Number(document.getElementById('humMin').value)
        },
        timing: {
          read_interval_sec: Number(document.getElementById('readInterval').value),
          keep_alive_sec: Number(document.getElementById('keepAlive').value),
          immediate_alert_cooldown: Number(document.getElementById('alertCooldown').value)
        }
      };

      configRef.update(updatedConfig)
        .then(() => alert("Configuration updated successfully in Firebase!"))
        .catch((error) => alert("Error updating configuration: " + error.message));
    }
  </script>
</body>
</html>
