<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .dashboard-container { max-width: 480px; width: 100%; text-align: center; }
  </style>
</head>
<body>

  <div class="card dashboard-container">
    <div class="card-header" style="margin-bottom: 12px;">
      <h2>Dashboard</h2>
      <p class="subtitle">System active. Use app controls to navigate.</p>
    </div>
  </div>

  <script>
    // Sends actions/data back to App Inventor via WebViewer string
    function sendToAppInventor(action, data = {}) {
      const payload = JSON.stringify({ action: action, ...data });
      if (window.AppInventor) {
        window.AppInventor.setWebViewString(payload);
      }
    }

    // This function can be called from App Inventor if needed
    function notifyDashboardLoaded() {
      sendToAppInventor("DASHBOARD_READY");
    }
  </script>
</body>
</html>
