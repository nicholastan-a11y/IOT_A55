<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    .dashboard-container { max-width: 480px; width: 100%; }
    .info-badge {
      display: flex; justify-content: space-between; font-size: 0.8rem;
      color: var(--text-muted); background: var(--input-bg);
      padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
      border: 1px solid var(--input-border);
    }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .metric-card { background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px; padding: 16px; text-align: center; }
    .metric-card.full-width { grid-column: span 2; }
    .metric-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px; }
    .metric-value { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 10px; padding: 12px 16px; margin-bottom: 12px;
    }
    .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--input-border); transition: .3s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>

  <div class="card dashboard-container">
    <div class="card-header" style="margin-bottom: 16px;">
      <h2>System Dashboard</h2>
      <p class="subtitle">Device: pico_001[cite: 9]</p>
    </div>

    <!-- Info Badge -->
    <div class="info-badge">
      <span>Device ID: <strong>pico_001</strong>[cite: 9]</span>
      <span id="timestampVal">Synced: N/A</span>
    </div>

    <!-- DHT11 Status Toggle -->
    <div class="status-row">
      <span>DHT11 Enabled</span>
      <label class="toggle-switch">
        <input type="checkbox" id="dhtEnabled" onchange="toggleControl('dht11_enabled', this.checked)">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Temperature & Humidity Metrics -->
    <div class="metric-grid">
      <div class="metric-card">
        <div class="metric-label">Temperature (°C / °F)[cite: 9]</div>
        <div class="metric-value" id="tempVal">N/A</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Humidity[cite: 9]</div>
        <div class="metric-value" id="humVal">N/A</div>
      </div>
    </div>

    <!-- MQ135 Status Toggle -->
    <div class="status-row">
      <span>MQ135 Enabled</span>
      <label class="toggle-switch">
        <input type="checkbox" id="mqEnabled" onchange="toggleControl('mq135_enabled', this.checked)">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Gas & Alert Status Grid -->
    <div class="metric-grid">
      <div class="metric-card">
        <div class="metric-label">Gas Status[cite: 9]</div>
        <div class="metric-value" id="gasStatus" style="font-size: 1rem;">N/A</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Gas Alert[cite: 9]</div>
        <div class="metric-value" id="gasAlert" style="font-size: 1rem;">N/A</div>
      </div>
      <div class="metric-card full-width">
        <div class="metric-label">Alert Status[cite: 9]</div>
        <div class="metric-value" id="alertStatus" style="font-size: 1rem;">N/A</div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('devices/pico_001');

    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const status = data.sensor_status || {};
      document.getElementById('tempVal').innerText = `${status.temperature_c ?? 'N/A'}°C (${status.temperature_f ?? 'N/A'}°F)`;
      document.getElementById('humVal').innerText = `${status.humidity ?? 'N/A'}%`;
      document.getElementById('gasStatus').innerText = status.gas_status ?? 'N/A';
      document.getElementById('gasAlert').innerText = status.gas_alert ? 'ACTIVE' : 'NORMAL';
      document.getElementById('alertStatus').innerText = status.alert_status ?? 'N/A';
      document.getElementById('timestampVal').innerText = `Synced: ${status.timestamp ?? 'N/A'}`;

      const control = data.configuration?.control || {};
      document.getElementById('dhtEnabled').checked = Boolean(control.dht11_enabled);
      document.getElementById('mqEnabled').checked = control.mq135_enabled === true || control.mq135_enabled === "true";
    });

    function toggleControl(key, value) {
      dbRef.child('configuration/control').update({ [key]: value });
    }
  </script>
</body>
</html>
