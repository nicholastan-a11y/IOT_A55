<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <!-- Google Fonts & Firebase SDKs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.12);
      --error-color: #f87171;
      --success-color: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-main);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon-wrapper {
      width: 48px;
      height: 48px;
      background: rgba(56, 189, 248, 0.1);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: var(--accent-color);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .input-field::placeholder {
      color: rgba(148, 163, 184, 0.5);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .msg {
      margin-top: 16px;
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.4;
      border-radius: 6px;
      padding: 8px 12px;
      display: none;
    }

    .error-msg {
      display: block;
      background: rgba(248, 113, 113, 0.1);
      color: var(--error-color);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }

    .success-msg {
      display: block;
      background: rgba(74, 222, 128, 0.1);
      color: var(--success-color);
      border: 1px solid rgba(74, 222, 128, 0.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your registered email below to receive recovery instructions.</p>
    </div>

    <div class="form-group">
      <label for="resetEmail">Email Address</label>
      <input type="email" id="resetEmail" class="input-field" placeholder="name@company.com" required>
    </div>

    <button class="btn btn-primary" onclick="resetPassword()">Send Reset Link</button>

    <div class="msg" id="statusMsg"></div>
  </div>
  <script src="config.js"></script>
  <script>
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    function sendToAppInventor(action, status, email, extra = "") {
      const payload = JSON.stringify({
        action: action,     // "RESET_PASSWORD"
        status: status,     // "SUCCESS" or "ERROR"
        email: email,
        extra: extra        // Error details if any
      });
      if (window.AppInventor) {
        window.AppInventor.setWebViewString(payload);
      }
    }

    function showStatus(msg, isError = false) {
      const el = document.getElementById('statusMsg');
      el.className = isError ? "msg error-msg" : "msg success-msg";
      el.innerText = msg;
    }

    // Password Reset Email Dispatcher
    function resetPassword() {
      const email = document.getElementById('resetEmail').value;

      if (!email) {
        showStatus("Please enter your email to reset password.", true);
        return;
      }

      firebase.auth().sendPasswordResetEmail(email)
        .then(() => {
          showStatus("Password reset link sent! Check your inbox.", false);
          sendToAppInventor("RESET_PASSWORD", "SUCCESS", email);
        })
        .catch((error) => {
          showStatus(error.message, true);
          sendToAppInventor("RESET_PASSWORD", "ERROR", email, error.message);
        });
    }
  </script>

</body>
</html>
